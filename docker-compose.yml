version: '3.8'

services:
  tinyinfer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.tinyinfer.description=TinyInfer-WASM Web Application"
      - "com.tinyinfer.version=0.8.0"

  # Optional: Add a reverse proxy with SSL

[package]
name = "tinyinfer-core"
version = "0.1.0"
edition = "2021"
authors = ["TinyInfer Contributors"]
description = "Lightweight neural network inference engine for WebAssembly"
license = "MIT"
repository = "https://github.com/GeoffreyWang1117/TinyInfer-WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Console error messages in development
console_error_panic_hook = { version = "0.1", optional = true }

# Logging
log = "0.4"
wasm-logger = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  'console',
  'Window',
  'Performance',
]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for small code size
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Enable SIMD
[target.'cfg(target_arch = "wasm32")'.dependencies]
# WASM SIMD will be used via core::arch::wasm32

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
